<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style.css">
<title>Login</title>
</head>
<body>
<div class="center-page">
    <div class="card">
        <div class="logo">حمى</div>
        <h2>أهلاً بعودتك 👋</h2>

        <div id="msg"></div>

        <input id="email" placeholder="البريد الإلكتروني">
        <input id="password" type="password" placeholder="كلمة المرور">

        <button onclick="login()">تسجيل الدخول</button>

        <div class="center-text">
            <a href="forgot-password.html">
                نسيت كلمة المرور؟
            </a>
        </div>

        <div class="center-text">
            <a href="register.html">
                ليس لديك حساب؟ سجّل الآن
            </a>
        </div>
    </div>
</div>
<script src="js/api.js"></script>

<script>
async function login(){

    const body={
        email:email.value,
        password:password.value
    };

    const res=await fetch(
        BASE_URL+"/login",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Accept":"application/json"
            },
            body:JSON.stringify(body)
        }
    );

    const data=await res.json();

    if(res.ok){
        handleLoginSuccess(data);
    }else{
        msg.innerHTML=
        '<div class="error">بيانات غير صحيحة</div>';
    }
} 
// تحقق من URL params بعد التفعيل
const urlParams = new URLSearchParams(window.location.search);
const verified  = urlParams.get('verified');
const error     = urlParams.get('error');

if (verified === 'success') {
    document.getElementById('msg').innerHTML =
        '<div class="success">✅ تم تفعيل حسابك! يمكنك الآن تسجيل الدخول</div>';
}
if (verified === 'already') {
    document.getElementById('msg').innerHTML =
        '<div class="success">حسابك مفعّل مسبقاً</div>';
}
if (error === 'invalid_link') {
    document.getElementById('msg').innerHTML =
        '<div class="error">رابط التفعيل غير صالح أو منتهي الصلاحية</div>';
}
</script>

</body>
</html>
